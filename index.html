    <script>
      (function () {
        function patchReadonlyFetch(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && typeof desc.get === 'function' && !desc.set && desc.configurable) {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: desc.enumerable !== false,
                get: desc.get,
                set: function () {},
              });
            }
          } catch (_err) {}
        }

        patchReadonlyFetch(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          patchReadonlyFetch(Window.prototype);
        }

        function isExtensionFetchConflict(message, filename, stack) {
          var src = String(filename || '') + ' ' + String(stack || '');
          var msg = String(message || '');
          return (
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1 ||
            src.indexOf('safari-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch of #<Window>') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var errStack = event && event.error && event.error.stack ? event.error.stack : '';
            if (isExtensionFetchConflict(event && event.message, event && event.filename, errStack)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && reason.message ? reason.message : String(reason || '');
            var stack = reason && reason.stack ? reason.stack : '';
            if (isExtensionFetchConflict(msg, '', stack)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        if (typeof queueMicrotask === 'function') {
          queueMicrotask(function () {
            patchReadonlyFetch(window);
          });
        }
        document.addEventListener(
          'readystatechange',
          function () {
            patchReadonlyFetch(window);
          },
          { passive: true }
        );
      })();
    </script>
