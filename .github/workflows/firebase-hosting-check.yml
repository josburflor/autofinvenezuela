name: Firebase Hosting build check

on:
  push:
    branches: [firebase-hosting-interface]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Type check
        run: npm run lint
      - name: Build frontend
        run: npm run build
